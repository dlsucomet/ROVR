<svg viewBox="0 0 700 580" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="700" height="580" fill="#fafafa"/>
  <text x="350" y="32" font-size="20" font-weight="700" text-anchor="middle" fill="#1e293b">ROVR — Combined Scene Layout</text>
  <text x="350" y="52" font-size="12" text-anchor="middle" fill="#64748b">Schematic — not to scale. Each world ~200m from the others, no walkable connection.</text>

  <!-- House -->
  <rect x="60" y="330" width="200" height="150" fill="#eef6ff" stroke="#1e293b" stroke-width="3" rx="4"/>
  <text x="160" y="410" font-size="16" font-weight="700" text-anchor="middle" fill="#1e293b">HOUSE</text>
  <text x="160" y="430" font-size="11" text-anchor="middle" fill="#64748b">24 × 20 m</text>
  <text x="160" y="465" font-size="11" text-anchor="middle" fill="#64748b">world offset (0, 0, 0)</text>

  <!-- Plain -->
  <rect x="440" y="310" width="200" height="180" fill="#fff7ed" stroke="#1e293b" stroke-width="3" rx="4"/>
  <text x="540" y="400" font-size="16" font-weight="700" text-anchor="middle" fill="#1e293b">PLAIN</text>
  <text x="540" y="420" font-size="11" text-anchor="middle" fill="#64748b">40 × 40 m</text>
  <text x="540" y="465" font-size="11" text-anchor="middle" fill="#64748b">world offset (200, 0, 0)</text>

  <!-- Maze -->
  <rect x="60" y="90" width="240" height="150" fill="#f0fdf4" stroke="#1e293b" stroke-width="3" rx="4"/>
  <text x="180" y="170" font-size="16" font-weight="700" text-anchor="middle" fill="#1e293b">MAZE</text>
  <text x="180" y="190" font-size="11" text-anchor="middle" fill="#64748b">28 × 20 m</text>
  <text x="180" y="225" font-size="11" text-anchor="middle" fill="#64748b">world offset (0, 0, 200)</text>

  <!-- gap: house <-> plain -->
  <line x1="264" y1="405" x2="436" y2="400" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="350" y="390" font-size="12" text-anchor="middle" fill="#475569" font-weight="600">~176 m empty ground</text>

  <!-- gap: house <-> maze -->
  <line x1="160" y1="326" x2="180" y2="244" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="205" y="290" font-size="12" text-anchor="middle" fill="#475569" font-weight="600" transform="rotate(-84 205 290)">~180 m empty ground</text>

  <!-- legend note -->
  <rect x="60" y="510" width="580" height="50" fill="#ffffff" stroke="#cbd5e1" rx="6"/>
  <text x="80" y="530" font-size="11" fill="#334155">Built by Tools → ROVR → Generate All Three Worlds (WorldBuilder.cs)</text>
  <text x="80" y="547" font-size="11" fill="#334155">Each generator still runs standalone at offset (0,0,0) from its own menu item.</text>
</svg>
