<svg viewBox="0 0 700 580" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
<rect width="700" height="580" fill="#fafafa"/>
<text x="350" y="30" font-size="20" font-weight="700" text-anchor="middle" fill="#1e293b">ROVR — Combined Scene Layout</text>
<text x="350" y="50" font-size="12" text-anchor="middle" fill="#64748b">Schematic — not to scale. Each world ~170 m or more from the others, no walkable connection.</text>
<rect x="60" y="330" width="200" height="150" fill="#eef6ff" stroke="#1e293b" stroke-width="3" rx="4"/>
<text x="160" y="400" font-size="16" font-weight="700" text-anchor="middle" fill="#1e293b">HOUSE</text>
<text x="160" y="420" font-size="11" text-anchor="middle" fill="#64748b">24 × 20 m · 2 storeys</text>
<text x="160" y="465" font-size="11" text-anchor="middle" fill="#64748b">world offset (0, 0, 0)</text>
<rect x="400" y="290" width="240" height="200" fill="#fff7ed" stroke="#1e293b" stroke-width="3" rx="4"/>
<text x="520" y="385" font-size="16" font-weight="700" text-anchor="middle" fill="#1e293b">PLAIN</text>
<text x="520" y="405" font-size="11" text-anchor="middle" fill="#64748b">100 × 100 m · one tree landmark</text>
<text x="520" y="465" font-size="11" text-anchor="middle" fill="#64748b">world offset (200, 0, 0)</text>
<rect x="60" y="90" width="240" height="150" fill="#f0fdf4" stroke="#1e293b" stroke-width="3" rx="4"/>
<text x="180" y="160" font-size="16" font-weight="700" text-anchor="middle" fill="#1e293b">MAZE</text>
<text x="180" y="180" font-size="11" text-anchor="middle" fill="#64748b">48 × 36 m (+8 m floor margin)</text>
<text x="180" y="225" font-size="11" text-anchor="middle" fill="#64748b">world offset (0, 0, 200)</text>
<line x1="264" y1="405" x2="396" y2="395" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,5"/>
<text x="330" y="380" font-size="12" text-anchor="middle" fill="#475569" font-weight="600">~176 m empty ground</text>
<line x1="160" y1="326" x2="180" y2="244" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,5"/>
<text x="205" y="290" font-size="12" text-anchor="middle" fill="#475569" font-weight="600" transform="rotate(-84 205 290)">~172 m empty ground</text>
<rect x="60" y="510" width="580" height="50" fill="#ffffff" stroke="#cbd5e1" rx="6"/>
<text x="80" y="530" font-size="11" fill="#334155">Built by Tools → ROVR → Generate All Three Worlds (WorldBuilder.cs)</text>
<text x="80" y="547" font-size="11" fill="#334155">Each generator still runs standalone at offset (0,0,0) from its own menu item.</text>
</svg>